name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0
    
    - name: Setup UV
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: '3.12'

    - name: Install Dependencies
      run: uv sync
    
    - name: Run Tests
      env:
        PYTHONPATH: .
      run: uv run pytest -v -s
